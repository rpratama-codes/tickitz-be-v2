version: "3.8"

services:
  app:
    image: rizqipratama1st/tickitz-be-v2:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tickitz-be-v2
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
