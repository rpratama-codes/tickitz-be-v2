apiVersion: apps/v1
kind: Deployment
metadata:
  name: tickitz-be-v2
  namespace: tickitz
  labels:
    app.kubernetes.io/name: tickitz-be-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tickitz-be-v2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tickitz-be-v2
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: tickitz-be-v2
          image: rizqipratama1st/tickitz-be-v2:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: tickitz-config
            - secretRef:
                name: tickitz-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
